function fmtCell(v){
  if(v===0)return'<span style="color:#484f58">—</span>';
  if(v>=10000)return'<span style="color:#c9d1d9">¥'+(v/10000).toFixed(1)+'万</span>';
  return'<span style="color:#8b949e">¥'+Math.round(v).toLocaleString()+'</span>';
}

function renderTable(mode){
  const tbl=document.getElementById('detailTable');
  const data=mode==='618'?detail618:detail11;
  const cols=mode==='618'?cols618:cols11;
  let html='<thead><tr><th>日期</th>';
  cols.forEach(c=>{html+=`<th>${c}</th>`;});
  html+='<th style="color:#e6edf3">当日合计</th></tr></thead><tbody>';
  let totals={};cols.forEach(c=>totals[c]=0);let grandTotal=0;
  data.forEach(r=>{
    const rowTotal=cols.reduce((s,c)=>s+(r[c]||0),0);
    grandTotal+=rowTotal;
    html+=`<tr><td>${r.date}</td>`;
    cols.forEach(c=>{totals[c]+=(r[c]||0);html+=`<td>${fmtCell(r[c]||0)}</td>`;});
    html+=`<td class="total-col">¥${(rowTotal/10000).toFixed(1)}万</td></tr>`;
  });
  html+='<tr class="total-row"><td>合计</td>';
  cols.forEach(c=>{html+=`<td>¥${(totals[c]/10000).toFixed(1)}万</td>`;});
  html+=`<td>¥${(grandTotal/10000).toFixed(1)}万</td></tr>`;
  html+='</tbody>';
  tbl.innerHTML=html;
}

let chart=null;
function switchChart(mode,btn){
  document.querySelectorAll('.tab-bar .tab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(chart)chart.destroy();
  const ctx=document.getElementById('mainChart').getContext('2d');
  const s11=mode==='daily'?d11daily.map(v=>+(v/10000).toFixed(2)):cum11.map(v=>+(v/10000).toFixed(2));
  const s618=mode==='daily'?d618daily.map(v=>+(v/10000).toFixed(2)):cum618.map(v=>+(v/10000).toFixed(2));
  chart=new Chart(ctx,{
    type:'line',
    data:{
      labels:xLabels,
      datasets:[
        {label:'双十一',data:s11,borderColor:'#388bfd',backgroundColor:'rgba(56,139,253,.07)',borderWidth:2,pointRadius:3,pointBackgroundColor:'#388bfd',tension:.3,fill:mode==='cum',spanGaps:false},
        {label:'618',data:s618,borderColor:'#ffa94d',backgroundColor:'rgba(255,140,0,.05)',borderWidth:2,borderDash:[5,4],pointRadius:3,pointBackgroundColor:'#ffa94d',tension:.3,fill:false,spanGaps:false}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'#1c2128',borderColor:'#30363d',borderWidth:1,titleColor:'#8b949e',bodyColor:'#c9d1d9',
          callbacks:{
            title:items=>`${items[0].label}（${items[0].dataIndex<labels11.length?labels11[items[0].dataIndex]:'—'} / ${items[0].dataIndex<labels618.length?labels618[items[0].dataIndex]:'—'}）`,
            label:ctx=>`${ctx.dataset.label}: ¥${ctx.parsed.y!=null?ctx.parsed.y.toFixed(1):'—'}万`
          }
        }
      },
      scales:{
        x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#6e7681',font:{size:10},maxTicksLimit:24,autoSkip:false,maxRotation:0}},
        y:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#6e7681',font:{size:10},callback:v=>`¥${v}万`}}
      }
    }
  });
}
