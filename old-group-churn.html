    const [name,month,coach,size,join,leave,rate,daily] = r;

    const netColor = net >= 0 ? '#27500A' : '#A32D2D';
    const netBg = net >= 0 ? '#EAF3DE' : '#FCEBEB';
    const rateColor = rate > 8 ? '#A32D2D' : rate > 5 ? '#633806' : 'var(--color-text-primary)';
    const tr = document.createElement('tr');
    tr.style.borderBottom = '0.5px solid var(--color-border-tertiary)';
    tr.innerHTML = `
      <td style="padding:5px 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--color-text-primary); font-size:11px;">${name}</td>
      <td style="padding:5px 8px; text-align:right; color:var(--color-text-secondary); font-size:11px;">${month.replace('2026年','')}</td>
      <td style="padding:5px 8px; text-align:right; color:var(--color-text-secondary); font-size:11px;">${coach}</td>
      <td style="padding:5px 8px; text-align:right; font-size:11px;">${size}</td>
      <td style="padding:5px 8px; text-align:right; font-size:11px;">${join}</td>
      <td style="padding:5px 8px; text-align:right; font-weight:500; font-size:11px;">${leave}</td>
      <td style="padding:5px 8px; text-align:right; color:${rateColor}; font-size:11px;">${rate.toFixed(1)}%</td>
      <td style="padding:5px 8px; text-align:right; font-size:11px;">${daily}</td>
      <td style="padding:5px 8px; text-align:right;"><span style="background:${netBg}; color:${netColor}; font-size:10px; padding:2px 6px; border-radius:4px;">${net>0?'+':''}${net}</span></td>
    `;
    tbody.appendChild(tr);
  });
  document.getElementById('tableCount').textContent = `共 ${data.length} 条记录`;
}

function getFiltered() {
  const month = document.getElementById('monthFilter').value;
  const sort = document.getElementById('sortFilter').value;
  const search = document.getElementById('searchBox').value.toLowerCase();
  let data = rawData.filter(r => {
    const monthOk = month === 'all' || r[1] === month;
    const searchOk = !search || r[0].includes(search);
    return monthOk && searchOk;
  });
  const sortKey = {leave:5,rate:6,daily:7,join:4}[sort];
  data.sort((a,b) => b[sortKey] - a[sortKey]);
  return data;
}

['monthFilter','sortFilter','searchBox'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => renderTable(getFiltered()));
  document.getElementById(id).addEventListener('input', () => renderTable(getFiltered()));
});

renderTable(getFiltered());

  }
});

const groups = [...new Set(rawData.map(r => r[0]))].sort();
const sel = document.getElementById('groupSelect');
groups.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; sel.appendChild(o); });

let groupChart = null;
function updateGroupChart(name) {
  const gData = months.map(m => rawData.find(r => r[0] === name && r[1] === m));
  const joinData = gData.map(r => r ? r[4] : null);
  const leaveData = gData.map(r => r ? r[5] : null);
  if (groupChart) groupChart.destroy();
  groupChart = new Chart(document.getElementById('groupTrend'), {
    type: 'bar',
    data: {
      labels: ['1月','2月','3月','4月','5月'],
      datasets: [
        { label: '入群人数', data: joinData, backgroundColor: '#85B7EB', borderRadius: 3 },
        { label: '退群人数', data: leaveData, backgroundColor: '#F09595', borderRadius: 3 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { grid: { color: 'rgba(128,128,128,0.1)' }, ticks: { font: { size: 11 } } },
        x: { ticks: { font: { size: 11 } } }
      }
    }
  });
}
sel.addEventListener('change', () => updateGroupChart(sel.value));
updateGroupChart(groups[0]);
